{% extends 'tenants/base.html' %}{% block panel %}{% if request.resolver_match.url_name == 'hotspot' %}<div class="dashboard-tools"><a href="{% url 'tenants:images' %}">Personalizar logotipo e imagens</a><a href="{% url 'tenants:hotspot-preview' %}" target="_blank" rel="noopener">Ver prévia no celular ↗</a></div>{% endif %}<form class="panel-form" method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="button button-primary" type="submit">Salvar</button></form>{% if images %}<div class="image-grid">{% for image in images %}<figure><img src="{% url 'tenants:image' image.pk %}" alt="{{ image.title }}" loading="lazy"><figcaption>{{ image.title }} · {{ image.get_kind_display }}</figcaption></figure>{% endfor %}</div>{% endif %}{% endblock %}
