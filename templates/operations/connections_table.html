<div class="table-scroll"><table><thead><tr><th>Estabelecimento / equipamento</th><th>VPN</th><th>API RouterOS</th><th>Hotspot</th><th>Verificação</th></tr></thead><tbody>{% for row in states %}<tr><td><strong>{{ row.device.tenant.name }}</strong><br>{{ row.device.name }}</td><td><span class="status-label">{{ row.vpn }}</span></td><td>{{ row.api }}</td><td>{{ row.hotspot }}</td><td>{{ row.checked_at|default_if_none:'Ainda não monitorado' }}</td></tr>{% empty %}<tr><td colspan="5">Nenhum equipamento cadastrado.</td></tr>{% endfor %}</tbody></table></div>
